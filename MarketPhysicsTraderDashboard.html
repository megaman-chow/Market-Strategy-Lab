
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Physics Trader — Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');
        
        :root {
            --bg:#07090c;--panel:#0b0e13;--panel2:#0e1219;--border:#141c26;--border2:#1c2a3a;
            --text:#a8bdd0;--dim:#324558;--muted:#0f1520;
            --green:#00e676;--green2:rgba(0,230,118,.14);
            --red:#ff1744;--red2:rgba(255,23,68,.14);
            --blue:#40c4ff;--teal:#64ffda;--amber:#ffd740;--purple:#ce93d8;--orange:#ff9100;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            font-size: 13px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        header {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 24px;
            color: #fff;
            letter-spacing: 0.1em;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        .btn {
            background: transparent;
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
        }
        
        .btn:hover { border-color: var(--blue); color: var(--blue); }
        .btn.primary { border-color: var(--green); color: var(--green); }
        .btn.primary:hover { background: var(--green2); }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 20px;
            transition: all 0.3s;
        }
        
        .card:hover { border-color: var(--border2); }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.08em;
        }
        
        .badge {
            font-size: 9px;
            padding: 3px 8px;
            border: 1px solid;
            letter-spacing: 0.1em;
            font-weight: 700;
        }
        
        .badge.running { color: var(--green); border-color: var(--green); background: var(--green2); }
        .badge.stopped { color: var(--dim); border-color: var(--border); }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 11px;
        }
        
        .stat-label { color: var(--dim); }
        .stat-value { font-weight: 600; }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.blue { color: var(--blue); }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal.show { display: flex; }
        
        .modal-content {
            background: var(--panel2);
            border: 1px solid var(--border2);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        
        .modal-title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 0.1em;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 10px;
            color: var(--dim);
            margin-bottom: 6px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        
        input, select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 10px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
        }
        
        input:focus, select:focus { border-color: var(--blue); }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--dim);
        }
        
        .empty-state h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1><span class="status-dot"></span>MARKET PHYSICS TRADER</h1>
                <div style="font-size:10px;color:var(--dim);margin-top:8px;letter-spacing:0.12em">
                    LIVE TRADING DASHBOARD v2.0
                </div>
            </div>
            <button class="btn primary" onclick="showCreateModal()">+ NEW TRADER</button>
        </header>
        
        <div id="traders" class="grid"></div>
        
        <div id="emptyState" class="empty-state" style="display:none">
            <h2>🤖 No Active Traders</h2>
            <p>Create your first trader to start receiving signals</p>
            <button class="btn primary" onclick="showCreateModal()" style="margin-top:20px">+ CREATE TRADER</button>
        </div>
    </div>
    
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">⚡ CREATE NEW TRADER</div>
            
            <form id="createForm">
                <div class="form-group">
                    <label class="form-label">Trader Name</label>
                    <input type="text" name="name" placeholder="e.g. BTC 1H V2 Long" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Timeframe</label>
                    <select name="timeframe" required>
                        <option value="5m">5 Minutes</option>
                        <option value="15m">15 Minutes</option>
                        <option value="1h" selected>1 Hour</option>
                        <option value="4h">4 Hours</option>
                        <option value="1d">1 Day</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Strategy</label>
                    <select name="strategy" required>
                        <option value="v1">V1 — Basic (Wick + Physics)</option>
                        <option value="v2" selected>V2 — Tight (4-Filter)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">TP Distance ($)</label>
                    <input type="number" name="tpDistance" value="50" min="10" step="5" required>
                </div>
                
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" name="invertLogic" id="invertLogic">
                        <label for="invertLogic" style="color:var(--text);cursor:pointer">
                            ⇄ Invert Logic (Reverse all signals)
                        </label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn" onclick="closeCreateModal()" style="flex:1">CANCEL</button>
                    <button type="submit" class="btn primary" style="flex:1">CREATE & START</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        let ws;
        let traders = [];
        
        function connect() {
            ws = new WebSocket(`ws://${location.host}`);
            
            ws.onopen = () => {
                console.log('✓ Connected');
                loadTraders();
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'new_candle') {
                    updateTrader(data.traderId, data.state);
                }
                
                if (data.type === 'position_opened' || data.type === 'position_closed') {
                    updateTrader(data.traderId, data.state);
                }
                
                if (data.type === 'trader_started') {
                    loadTraders();
                }
            };
            
            ws.onclose = () => {
                console.log('Reconnecting...');
                setTimeout(connect, 3000);
            };
        }
        
        async function loadTraders() {
            try {
                const res = await fetch('/api/traders');
                traders = await res.json();
                renderTraders();
            } catch (error) {
                console.error('Failed to load traders:', error);
            }
        }
        
        function renderTraders() {
            const container = document.getElementById('traders');
            const empty = document.getElementById('emptyState');
            
            if (!traders.length) {
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            
            container.innerHTML = traders.map(trader => {
                const state = trader.state || {};
                const pnl = state.pnl || 0;
                const winRate = state.winRate || 0;
                
                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">${trader.name}</div>
                            <span class="badge ${state.isRunning ? 'running' : 'stopped'}">
                                ${state.isRunning ? '🔴 LIVE' : '⏸ STOPPED'}
                            </span>
                        </div>
                        
                        <div class="stat-row">
                            <span class="stat-label">Strategy</span>
                            <span class="stat-value">${trader.strategy.toUpperCase()} · ${trader.timeframe} ${trader.invertLogic ? '⇄' : ''}</span>
                        </div>
                        
                        <div class="stat-row">
                            <span class="stat-label">Balance</span>
                            <span class="stat-value blue">$${(state.balance || 10000).toFixed(2)}</span>
                        </div>
                        
                        <div class="stat-row">
                            <span class="stat-label">P&L</span>
                            <span class="stat-value ${pnl >= 0 ? 'green' : 'red'}">
                                ${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}
                            </span>
                        </div>
                        
                        <div class="stat-row">
                            <span class="stat-label">Trades</span>
                            <span class="stat-value">${state.trades || 0}</span>
                        </div>
                        
                        <div class="stat-row">
                            <span class="stat-label">Win Rate</span>
                            <span class="stat-value ${winRate >= 0.55 ? 'green' : winRate >= 0.45 ? '' : 'red'}">
                                ${(winRate * 100).toFixed(1)}%
                            </span>
                        </div>
                        
                        ${state.openPosition ? `
                        <div class="stat-row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
                            <span class="stat-label">OPEN POSITION</span>
                            <span class="stat-value ${state.openPosition.dir === 'bullish' ? 'green' : 'red'}">
                                ${state.openPosition.dir === 'bullish' ? '▲ LONG' : '▼ SHORT'} @ $${state.openPosition.entry.toFixed(0)}
                            </span>
                        </div>
                        ` : ''}
                        
                        <div style="display:flex;gap:8px;margin-top:16px">
                            <button class="btn" onclick="viewTrader('${trader.id}')" style="flex:1">VIEW</button>
                            ${state.isRunning ? 
                                `<button class="btn" onclick="stopTrader('${trader.id}')" style="flex:1;color:var(--red);border-color:var(--red)">STOP</button>` :
                                ''
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function updateTrader(traderId, state) {
            if (state) {
                const trader = traders.find(t => t.id === traderId);
                if (trader) {
                    trader.state = state;
                    renderTraders();
                }
            } else {
                loadTraders();
            }
        }
        
        function showCreateModal() {
            document.getElementById('createModal').classList.add('show');
        }
        
        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('show');
            document.getElementById('createForm').reset();
        }
        
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                name: formData.get('name'),
                timeframe: formData.get('timeframe'),
                strategy: formData.get('strategy'),
                tpDistance: parseInt(formData.get('tpDistance')),
                invertLogic: formData.get('invertLogic') === 'on'
            };
            
            try {
                const res = await fetch('/api/traders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    closeCreateModal();
                    loadTraders();
                    alert('✓ Trader created and started!');
                }
            } catch (error) {
                alert('Failed to create trader: ' + error.message);
            }
        });
        
        async function stopTrader(id) {
            if (!confirm('Stop this trader?')) return;
            
            try {
                await fetch(`/api/traders/${id}/stop`, { method: 'POST' });
                loadTraders();
            } catch (error) {
                alert('Failed to stop trader: ' + error.message);
            }
        }
        
        function viewTrader(id) {
            window.location.href = `/strategyLab.html?trader=${id}`;
        }
        
        connect();
    </script>
</body>
</html>
